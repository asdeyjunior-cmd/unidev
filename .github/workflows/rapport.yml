# Rapport du matin : crédits de parrainage, vitrine du site (documents recherchés), notification à l'admin.
name: Rapport du matin

on:
  schedule:
    - cron: "12 8 * * *"   # 8h12 à Abidjan, juste après la remise à zéro du quota Firestore
  workflow_dispatch:

concurrency: { group: unidev-rapport, cancel-in-progress: false }

jobs:
  rapport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: outils/import } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Installation et clés
        env:
          CLE: ${{ secrets.FIREBASE_CLE_JSON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          npm install --no-audit --no-fund
          printf '%s' "$CLE" > cle-firebase.json
          printf 'FIREBASE_CLE=./cle-firebase.json\n' > .env
      - name: Rapport
        run: |
          set -o pipefail
          node rapport.js 2>&1 | tee resultat.txt
      - name: Résumé
        if: always()
        run: |
          { echo "### Rapport du matin"; echo "Envoyé sur ton téléphone (le détail n'est pas affiché ici : le dépôt est public)."; } >> "$GITHUB_STEP_SUMMARY" || true
