# Supprime de Cloudinary les fichiers qui ne servent plus (le 1er de chaque mois, ou à la demande).
name: Nettoyer Cloudinary

on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 1 * *"

jobs:
  nettoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: outils/import } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Nettoyage
        env:
          CLE: ${{ secrets.FIREBASE_CLE_JSON }}
          CK: ${{ secrets.CLOUDINARY_API_KEY }}
          CS: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_COMPTES: ${{ secrets.CLOUDINARY_COMPTES }}
        run: |
          npm install --no-audit --no-fund
          export NODE_OPTIONS=--max-old-space-size=5120
          printf '%s' "$CLE" > cle-firebase.json
          printf 'CLOUDINARY_CLOUD_NAME=iugeyztf\nCLOUDINARY_API_KEY=%s\nCLOUDINARY_API_SECRET=%s\nFIREBASE_CLE=./cle-firebase.json\n' "$CK" "$CS" > .env
          set -o pipefail
          node nettoyer.js 2>&1 | tee resultat.txt
      - name: Résumé
        if: always()
        working-directory: outils/import
        run: |
          { echo "### Nettoyage"; echo '```'; tail -n 30 resultat.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
