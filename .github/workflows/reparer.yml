# UN SEUL BOUTON : répare tous les PDF du site (logo et signature Fomesoutra -> unidev, anciennes marques ratées retirées,
# petit logo unidev en bas des pages). Sans réglage : GitHub > Actions > « Réparer tous les documents » > Run workflow.
name: Réparer tous les documents

on:
  workflow_dispatch:

concurrency: { group: unidev-signature, cancel-in-progress: false }

jobs:
  reparer:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults: { run: { working-directory: outils/import } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Réparation
        env:
          CLE: ${{ secrets.FIREBASE_CLE_JSON }}
          CK: ${{ secrets.CLOUDINARY_API_KEY }}
          CS: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_COMPTES: ${{ secrets.CLOUDINARY_COMPTES }}
          R2_URL: ${{ secrets.R2_URL }}
          OUTILS_SECRET: ${{ secrets.OUTILS_SECRET }}
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          npm install --no-audit --no-fund
          printf '%s' "$CLE" > cle-firebase.json
          printf 'CLOUDINARY_CLOUD_NAME=iugeyztf\nCLOUDINARY_API_KEY=%s\nCLOUDINARY_API_SECRET=%s\nFIREBASE_CLE=./cle-firebase.json\n' "$CK" "$CS" > .env
          set -o pipefail
          node signature.js --site fomesoutra --remplacer "fomesoutra,fo me soutra" --refaire --tous 2>&1 | tee resultat.txt
      - name: Résumé
        if: always()
        run: |
          { echo "### Réparation"; echo '```'; grep -E "^Outil|document\(s\) PDF|Terminé" resultat.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
