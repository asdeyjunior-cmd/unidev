# Chaque nuit (et à la demande) : pages Google des nouveaux documents, mise en ligne, signalement à Bing.
name: Mettre le site en ligne

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["outils/import/import-journal.json"]
  schedule:
    - cron: "17 2 * * *"   # tous les jours vers 2 h du matin (heure d'Abidjan)

concurrency: { group: unidev-deploy, cancel-in-progress: true }

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Cache des pages (économise les lectures Firestore)
        uses: actions/cache@v4
        with:
          path: outils/import/pages-cache.json
          key: pages-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pages-cache-
      - name: Pages Google des documents
        id: pages
        working-directory: outils/import
        env: { CLE: "${{ secrets.FIREBASE_CLE_JSON }}" }
        run: |
          npm install --no-audit --no-fund
          printf '%s' "$CLE" > cle-firebase.json
          set -o pipefail
          node pages.js 2>&1 | tee resultat.txt
      # Mise en ligne seulement si les pages Google sont prêtes (sinon elles seraient effacées du site)
      - name: Mise en ligne
        if: steps.pages.outcome == 'success'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UNIDEV_2026 }}
          projectId: unidev-2026
          channelId: live
      - name: Prévenir Bing
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        run: node outils/import/indexnow.js
      - name: Résumé
        if: always()
        run: |
          { echo "### Mise en ligne"; echo '```'; tail -n 8 outils/import/resultat.txt 2>/dev/null || echo "Pas de résultat"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
