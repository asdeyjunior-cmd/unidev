  <header class="topbar"><div class="wrap topbar-in"><a href="../index.html" class="logo"><span class="logo-mark">u</span>unidev</a><div id="header-tools" class="header-tools"></div></div></header>
  <main class="page">
    <div class="wrap">

      <h1 class="page-title">Tous les documents</h1>
      <a class="btn btn-block td-retour" href="../index.html" style="margin:0 0 16px">Voir les documents avec leurs images</a>
      <!-- Version de secours : la liste se construit dans le navigateur (1 seule lecture).
           La mise en ligne par GitHub remplace cette page par une version toute prête pour Google. -->
      <input id="td-q" type="search" placeholder="Filtrer par titre, matière, filière…" style="margin:6px 0 14px" aria-label="Filtrer" />
      <p class="muted" id="td-etat">Chargement de la liste…</p>
      <div id="td-liste"></div>
    </div>
  </main>
  <script type="module">
    import { getSearchIndex } from "../js/firebase.js";
    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const norm = (t) => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    const slug = (t) => norm(t).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "autre";
    let docs = [];
    try {
      const memo = JSON.parse(sessionStorage.getItem("unidev-recherche") || "null");
      docs = memo?.docs?.length ? memo.docs : await getSearchIndex();
    } catch { docs = []; }
    function afficher() {
      const q = norm($("td-q").value.trim());
      const liste = docs.filter((d) => !q || norm([d.titre, d.matiere, d.filiere, d.type, d.niveau].join(" ")).includes(q));
      const groupes = new Map();
      for (const d of liste) { const f = d.filiere || "Autre"; if (!groupes.has(f)) groupes.set(f, []); groupes.get(f).push(d); }
      const noms = [...groupes.keys()].sort((a, b) => (a === "Autre") - (b === "Autre") || a.localeCompare(b, "fr"));
      $("td-etat").textContent = docs.length ? `${liste.length} document${liste.length > 1 ? "s" : ""}, classés par filière.` : "La liste n'a pas pu se charger. Réessaie dans un instant.";
      $("td-liste").innerHTML = noms.map((f) => `
        <h2 class="fd-h2" id="${slug(f)}">${esc(f)} <span class="muted">(${groupes.get(f).length})</span></h2>
        <ul class="fd-liste">${groupes.get(f).sort((a, b) => a.titre.localeCompare(b.titre, "fr")).map((d) =>
          `<li><a href="../index.html?doc=${encodeURIComponent(d.id)}">${esc(d.titre)}</a><span>${esc([d.type, d.niveau].filter((x) => x && x !== "Autre").join(" · "))}</span></li>`).join("")}</ul>`).join("");
      if (location.hash && !q) document.getElementById(location.hash.slice(1))?.scrollIntoView();
    }
    $("td-q").addEventListener("input", afficher);
    afficher();
  </script>
